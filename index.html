<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles/style.css">
        <title>OurMusic</title>
    </head>
    <body>
        <header>
            <h1>OurMusic</h1>
            <div class="search">
                <input type="text" id="search" oninput="search(this.value)">
                <div class="search-result" id="search-result">
                </div>
            </div>
            <div></div>
        </header>
        <main>

        </main>
        <section class="player">
            <div class="song-desc">
                <img height="60px" width="60px" src="Img/music.png" alt="thumbnail" id="song-thumbnail">
                <p id="song-name">ABCD</p>
            </div>
            <div class="controls">
                <button onclick="skip(-SKIP_AMOUNT)">⏪︎</button>
                <button>⏮︎</button>
                <button id="play-pause" onclick="swapPlayStatusAndUpdate()">►</button>
                <button>⏭</button>
                <button onclick="skip(SKIP_AMOUNT)">⏩︎</button>
                <div class="time-seek">
                    <span id="curr-timestamp">0:00</span>
                    <input type="range" id="time-seek" oninput="seek()" value="0">
                    <span id="max-timestamp">0:00</span>
                </div>
            </div>
            <div class="volume">
                <span id="vol-perc">100%</span>
                <input type="range" id="volume" oninput="setVolume()" value="1" max="1" step="0.01">
            </div>
        </section>
    </body>
    <script src="scripts/Player.js"></script>
    <script src="scripts/Search.js"></script>
</html>
